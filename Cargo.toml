[package]
name = "dmlive"
version = "5.7.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "*", features = ["client", "http1"] }
# tokio-rustls = "0.22"
# webpki-roots = "*"
# rustls = { version = "*", features = ["ring"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# tokio-tungstenite = { version = "0.29", features = ["native-tls-vendored"] }
# "native-tls-vendored"
reqwest = { version = "0.13", default-features = true, features = ["http2", "brotli", "deflate", "gzip", "json", "cookies", "query", "form"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
bincode = "2"
# wincode = { version = "0.2", features = ["derive"] }
rand = "0.10"
# regex = "1"
regex-lite = "0.1"
# fancy-regex = "0.17"
uuid = { version = "1.23", features = ["v4"] }
chrono = "0.4"
url = "2.5"
urlencoding = "2.1"
base64 = "0.22"
md5 = "*"
libc = "0.2"
toml = "1"
html-escape = "0.2"
futures = "0.3"
roxmltree = "0.21"
directories = "6"
anyhow = "1"
bytes = "1.12"
tars-stream = { path = "tars-stream"}
ring = "*"
cbc = "0.2"
aes = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
async-compression = { version = "0.4", features = ["tokio", "deflate", "brotli"] }

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.12", features = ["bindgen"] }
[target.'cfg(not(target_os = "android"))'.dependencies]
rquickjs = "0.12"

[profile.release]
panic = 'abort'
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
debug = true
split-debuginfo = "packed"
